name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.5.x"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run pytest tests/unit --cov=app --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_KEY: test-api-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      RATE_LIMIT_PER_MINUTE: "1000"
      LOG_LEVEL: WARNING
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/integration

  workflow:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_KEY: test-api-key
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      RATE_LIMIT_PER_MINUTE: "1000"
      LOG_LEVEL: WARNING
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/workflow

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration, workflow]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t incident-response-platform:ci .
